# The production ingress: static bundle + API proxy on ONE origin.
#
# Same-origin is the point. The bundle calls `/api/v1/...` relative to
# wherever it is served, so one image works on localhost, on a customer's
# hostname, and behind their TLS terminator without a rebuild. It also means
# no CORS preflight on any call the app makes.

# T6 (BUG-040): a Content-Security-Policy on every HTML response. The session
# is an httpOnly cookie script cannot read; this is the other half -- injected
# script cannot run at all. What stops script is strict (script-src, object-src,
# base-uri, form-action). What widgets legitimately reach stays open: custom
# visuals and web-content tiles FRAME external https pages, map tiles come from
# a configurable (often plain-http, internal) server, and React/Recharts set
# inline styles. The one eval in the bundle (JSZip's setImmediate polyfill,
# inside pptxgenjs) runs only for a string callback, which JSZip never passes.
#
# /embed is framed by customers' own sites, so only it may be framed from
# anywhere; the backend's /embed/report response already restricts WHICH hosts
# per embed config. Everything else may be framed by this origin only.
map $request_uri $dl_frame_ancestors {
    ~^/embed   "*";
    default    "'self'";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set $dl_csp "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors $dl_frame_ancestors; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https: http:; connect-src 'self' https: http:; frame-src 'self' https:; worker-src 'self' blob:; manifest-src 'self'";

    # Uploads: the batch endpoint accepts up to 200 MB (max_batch_upload_mb),
    # and nginx's 1 MB default would reject a large file before FastAPI ever
    # saw it -- with a 413 that looks like the app's own quota refusal.
    client_max_body_size 220m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Client-side routes (/reports/12, /admin/users) are not files on disk.
    # Without this fallback, opening one directly -- or reloading it -- 404s.
    # add_header in a location REPLACES the server's, so the HTML-serving
    # locations each carry the policy (the SPA fallback lands in /index.html).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy $dl_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite fingerprints these, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # These two must NEVER be cached: a stale index.html keeps pointing at the
    # previous build's hashed bundles, and a stale service worker keeps
    # serving the previous app after an upgrade.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy $dl_csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-store";
    }

    # The API, same origin. No trailing slash on proxy_pass, so the full URI
    # (/api/v1/...) is forwarded unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An agent question, a metadata sync or a PDF export can outlast the
        # 60s default; a truncated answer would look like an app bug.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Container orchestration probes this without the /api prefix.
    location /health {
        proxy_pass http://backend:8000/health;
        access_log off;
    }
}
