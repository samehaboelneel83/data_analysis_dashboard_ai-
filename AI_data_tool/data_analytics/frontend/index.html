<!DOCTYPE html>
<!-- data-product scopes the token layer in styles/datalytics.css. Static, so it
     belongs here rather than in main.tsx where it could race first paint, and it
     must sit on the same element as the data-theme main.tsx stamps: the dark
     palette selects on both at once. -->
<html lang="en" data-product="datalytics">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f121a" />
    <meta name="description" content="Build, explore and share interactive analytics reports." />
    <title>Datalytics</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
